name: eProcure registry refresh

# Device-free refresh of the eProcure side inputs: the SB/DVBE
# certified-supplier registry AND the lean CSCR event slices (Posted + recent
# Historical years). Drives the public PeopleSoft components behind
# caleprocure.ca.gov with headless Playwright (src/eprocure.py — the site's
# overlay APIs are not drivable without a browser; see docs/EPROCURE.md) and
# publishes eprocure.db to the operational dataset. Upload-on-success: a
# failed/partial run never overwrites good data — the extractor itself refuses
# to write an export/slice that falls short of the site's own result banner.
on:
  schedule:
    # Weekly — certifications churn slowly. Enrich now runs every 3h (17 */3);
    # 04:53 trails the 03:17 slot's worst case (~04:47) and may briefly queue
    # on the shared writer lock — safe by design (queue, never cancel).
    - cron: "53 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# Shares the operational-dataset single-writer group with the enrich + CMAS
# workflows so two commits never race the same dataset repo. Queue, don't cancel.
concurrency:
  group: scprs-operational-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Registry ~5 min + events (Posted + 3 Historical years, ~290 grid pages)
    # ~25 min; the events step self-budgets at 35 so this stays the backstop.
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: "1" # a killed run must still show how far it got
      # The operational store's private dataset (eprocure.db lands alongside scprs.db).
      SCPRS_DATASET: ${{ vars.SCPRS_DATASET || 'munther-hasan/scprs-operational-db' }}
      # Read+write on that dataset (same Actions secret CI uses as the sole writer).
      HF_SCPRS_TOKEN: ${{ secrets.HF_SCPRS_TOKEN }}
      # Chromium runs unprivileged on the runner — match the container launch flags.
      PLAYWRIGHT_NO_SANDBOX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "huggingface_hub>=0.25"
          playwright install --with-deps chromium

      - name: Extract registry (Playwright -> data/eprocure.db)
        run: python -m src.eprocure extract-registry

      # Lean CSCR event slices: live Posted + the current and two prior
      # Historical years, into the same store. Per-slice completeness is gated
      # in-extractor against the site's own banner; the budget stops cleanly
      # between slices ahead of the job timeout (finished slices are complete
      # on their own — no half-written slice can publish).
      - name: Extract events (Posted + recent Historical years)
        run: python -m src.eprocure extract-events --budget-minutes 35

      # Upload-on-success gate (#51): never publish a shrunken extract over good
      # data. The extractor already refuses an export short of the site's own
      # banner total, but that guards one run against itself; this compares
      # against the previously *published* store, catching e.g. a cert-type
      # checkbox that silently stopped committing (search covers a subset).
      # Registrations churn slowly, so the new extract must hold >=90% of the
      # previously published rows; the first-ever publish passes on >0.
      - name: Sanity-check the extract (shrink gate)
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee gate.log
          import sqlite3, sys
          from pathlib import Path
          from src import data_sync

          def count(path, table):
              con = sqlite3.connect(path)
              try:
                  if not con.execute(
                      "SELECT 1 FROM sqlite_master WHERE type='table' AND name=?", (table,)
                  ).fetchone():
                      return None
                  return con.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              finally:
                  con.close()

          new_reg = count("data/eprocure.db", "registry") or 0
          new_ev = count("data/eprocure.db", "events") or 0
          print(f"new registry rows: {new_reg}; new event rows: {new_ev}")
          if new_reg <= 0:
              print("FAIL: empty registry extract")
              sys.exit(1)

          prev_path = Path("data/eprocure_prev.db")
          try:
              have_prev = data_sync.fetch_eprocure_db(prev_path)
          except Exception as e:  # noqa: BLE001 - unreadable prior copy: warn, don't block
              print(f"WARN: could not fetch previous eprocure.db ({e!r}) — gating on >0 only")
              sys.exit(0)
          if not have_prev:
              print("no previously published eprocure.db — first publish, gate passes")
              sys.exit(0)
          # Both tables shrink-gate against the previously published store; a
          # table absent there (e.g. events before its first extraction) passes.
          for table, new in (("registry", new_reg), ("events", new_ev)):
              prev = count(prev_path, table)
              if prev is None:
                  print(f"{table}: not in previous store — passes")
                  continue
              floor = int(prev * 0.9)
              print(f"{table}: previous {prev}; floor (90%): {floor}; new {new}")
              if new < floor:
                  print(f"FAIL: {table} shrank below 90% of previous ({new} < {floor}) — "
                        "likely a partial search/export; NOT publishing")
                  sys.exit(1)
          print("OK: shrink gate passed")
          PY
          {
            echo "### eProcure registry refresh"
            echo '```'
            cat gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish eprocure.db to the operational dataset
        run: python -m src.data_sync publish-eprocure
