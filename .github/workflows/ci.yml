name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan during quiet periods: pip-audit/detect-secrets otherwise only
    # run on pushes, so a CVE in the deployed Spaces' deps could sit unnoticed
    # for as long as the repo is idle. A failure here triages like any main run.
    - cron: "23 5 * * 1"

# Least privilege: the whole workflow gets read-only by default.
# Grant more narrowly per-job only if a step needs it.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    # Typical run ~1 min; 15 min = install slowness + suite growth headroom.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: SAST (bandit)
        run: bandit -c pyproject.toml -r src -q

      - name: Dependency vulnerability scan (pip-audit)
        # Scan every requirements file, including the deps that ship to the
        # public-facing MCP Space (mcp, matplotlib, hf_hub). The web app's file
        # is audited in its own step below: pip-audit resolves all -r files as
        # ONE environment, and gradio's pillow<13 cap can't co-resolve with
        # the pillow>=13 floor in requirements-mcp/dev.txt.
        run: >
          pip-audit
          -r requirements.txt
          -r requirements-mcp.txt
          -r requirements-dev.txt

      - name: Dependency vulnerability scan (pip-audit, web app)
        # Accepted risk (2026-10-26; +CVE-2026-112394 raw decoder 2026-10-27):
        # pillow 12.3.0 advisories fixed in 13.0.0,
        # which every gradio 6.x (<=6.30.0) blocks via pillow<13. All sit in
        # pillow's codecs for untrusted image files (TIFF/GIF/PDF/EPS/...); the
        # web app is text-only (no upload component) and only renders its own
        # matplotlib PNGs, so none is reachable. Ignored by exact id, so any
        # NEW advisory still fails. Remove this list (and add pillow>=13 to
        # requirements-web.txt) once a gradio release allows pillow 13.
        run: >
          pip-audit
          -r requirements-web.txt
          --ignore-vuln CVE-2026-112390
          --ignore-vuln CVE-2026-112391
          --ignore-vuln CVE-2026-112392
          --ignore-vuln CVE-2026-112393
          --ignore-vuln CVE-2026-112394
          --ignore-vuln CVE-2026-112395
          --ignore-vuln CVE-2026-112396
          --ignore-vuln CVE-2026-112397
          --ignore-vuln CVE-2026-112398
          --ignore-vuln CVE-2026-112399
          --ignore-vuln CVE-2026-112400
          --ignore-vuln CVE-2026-112401
          --ignore-vuln CVE-2026-112402
          --ignore-vuln CVE-2026-112404
          --ignore-vuln CVE-2026-112405
          --ignore-vuln CVE-2026-112406
          --ignore-vuln CVE-2026-112891
          --ignore-vuln CVE-2026-112892
          --ignore-vuln CVE-2026-112893
          --ignore-vuln CVE-2026-112894
          --ignore-vuln CVE-2026-112895
          --ignore-vuln CVE-2026-112896
          --ignore-vuln CVE-2026-112897
          --ignore-vuln CVE-2026-112899
          --ignore-vuln CVE-2026-112900
          --ignore-vuln CVE-2026-112901
          --ignore-vuln CVE-2026-114501
          --ignore-vuln CVE-2026-96636
          --ignore-vuln CVE-2026-96637
          --ignore-vuln CVE-2026-96638
          --ignore-vuln CVE-2026-96639
          --ignore-vuln CVE-2026-96640
          --ignore-vuln CVE-2026-96641
          --ignore-vuln CVE-2026-96642
          --ignore-vuln CVE-2026-96643
          --ignore-vuln CVE-2026-96644
          --ignore-vuln CVE-2026-96778
          --ignore-vuln GHSA-78g4-xqwv-q3g8

      # Same scanner + baseline as the local pre-commit hook, so CI and dev
      # agree. Layered behind GitHub's native secret scanning + push protection
      # (which block known-provider credentials before they ever land).
      - name: Secret scan (detect-secrets)
        run: |
          git ls-files -z -- ':!:.secrets.baseline' \
            | xargs -0 python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline

      - name: Tests
        run: pytest -q
